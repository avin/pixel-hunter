[package]
name = "pixel-hunter-icon-replay"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "pixel-hunter-icon-replay"
path = "main.rs"

[dependencies]
opencv = { version = "=0.101.1", default-features = false, features = ["clang-runtime", "imgproc"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
