<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Hunter</title>
    <script>
      const view = new URLSearchParams(location.search).get("view");
      if (view === "viewer" || view === "picker") {
        document.documentElement.dataset.screenOverlay = "";
      }
    </script>
    <style>
      html[data-screen-overlay], html[data-screen-overlay] body {
        background: #000;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
